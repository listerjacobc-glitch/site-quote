<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Site Quote</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Turn a site measure-up into a priced materials list and quote.">
<meta name="theme-color" content="#1d3b5c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="bar">
  <div class="bar-inner">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span>Site Quote</div>
    <nav class="tabs" role="tablist">
      <button class="tab" data-view="quote" role="tab">Quote</button>
      <button class="tab" data-view="prices" role="tab">Prices</button>
      <button class="tab" data-view="saved" role="tab">Saved</button>
      <button class="tab" data-view="settings" role="tab">Settings</button>
    </nav>
  </div>
</header>
<main id="app" class="wrap"></main>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script src="js/materials.js"></script>
<script src="js/calculators.js"></script>
<script src="js/quote.js"></script>
<script src="js/app.js"></script>
</body>
</html>
